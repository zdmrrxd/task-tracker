spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5433/tasktracker
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update

# SQL logging disabled for better runtime performance
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=8081

# --- JWT ---
# In production, override via env var JWT_SECRET
# and never commit real secrets.
jwt.secret=${JWT_SECRET:change-this-super-secret-key-min-32-chars-long-please}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# --- Seeded default admin ---
# Change password after first login in real deployments.
app.seed.admin-username=${APP_SEED_ADMIN_USERNAME:admin}
app.seed.admin-email=${APP_SEED_ADMIN_EMAIL:admin@tasktracker.local}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:Admin123!}

# --- Performance / abuse protection ---
# Maximum number of tasks a user can own.
app.tasks.max-per-user=${APP_TASKS_MAX_PER_USER:300}